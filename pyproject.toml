[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-alpha"
version = "0.1.0"
description = "Typed decision probabilities through ms-swift plugins"
requires-python = ">=3.10"
dependencies = ["ms-swift @ git+https://github.com/modelscope/ms-swift.git@c2bcc23a1f1c428dc8be0ae509c31a532922453f"]

[project.optional-dependencies]
qwen = ["torch==2.8.0", "torchvision==0.23.0", "qwen-vl-utils==0.0.14", "decord==0.6.0"]

[tool.setuptools.packages.find]
include = ["jev_alpha", "jev_alpha.datasets"]

[tool.ruff]
target-version = "py310"
line-length = 119
indent-width = 4
extend-exclude = ["ms-swift"]
force-exclude = true

[tool.ruff.lint]
ignore = ["C901", "E501", "E741", "W605", "C408"]
select = ["C", "E", "F", "I", "W", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["jev_alpha"]
known-third-party = ["torch", "transformers", "wandb"]

[tool.ruff.lint.mccabe]
max-complexity = 75

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
